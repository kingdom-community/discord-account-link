name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18.x', '20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # `npm ci` rather than `npm install`: the install must be the lockfile
      # exactly, and must fail rather than quietly resolve something the
      # lockfile does not pin.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
